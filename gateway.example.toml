# ChronusGateway-RS — example gateway configuration (Milestone 8).
# Copy to e.g. `gateway.toml` and run: `chronus-gateway --config gateway.toml`
# Or set: CHRONUS_GATEWAY_CONFIG=gateway.toml
#
# Omitted `[ingest]` or `[station]` sections fall back to the same defaults as running with no file.
# When `[station]` is present, set exactly one orbit source: `tle_inline`, `tle_file` or `oem_file`
# (paths are relative to the process working directory unless given as absolute).

[ingest]
bind_addr = "127.0.0.1:7301"
channel_capacity = 1024
max_datagram_size = 65542
http_bind = "127.0.0.1:8080"

# Receiver-metadata side channel (Tranche 2, docs/RF_SIDE_CHANNEL.md). Optional; OFF unless
# `bind_addr` is set. Without it the Doppler (bit 0), link-budget (bit 2) and pointing (bit 3)
# checks have no measurements to compare and stay quiet. Send one `chronus.rf.v1` JSON datagram per
# measurement (an SDR sidecar, `chronus-replay --rf-dest`, or `chronus-hil-sim --rf-dest`).
# [rf]
# bind_addr = "127.0.0.1:7302"
# window_ms = 250      # a frame is matched to the sample nearest in time, within this window
# capacity = 1024      # samples kept (oldest dropped first)

# Spacecraft time codes (Tranche 2). Optional; OFF by default. With a format set, packets that have
# a secondary header are expected to start with a 6-byte time field and physics is evaluated at that
# ONBOARD time (falling back to receive time if it is missing, unreadable or too far from the
# gateway clock). `max_skew_s = 0.0` is lab/replay mode: trust the onboard time as-is, so recorded
# or simulated streams can be validated at their own mission time.
# [time]
# format = "cds"             # "none" (default), "cds" (UTC day+ms) or "cuc" (TAI seconds+fraction)
# max_skew_s = 5.0           # |onboard - receive| beyond this sets physics_flags_v2 bit 0; 0 = off
# cuc_tai_minus_utc_s = 37   # only used for "cuc"

[station]
latitude_deg = 35.0
longitude_deg = -116.0
altitude_m = 1000.0
nominal_carrier_hz = 437500000.0
min_recompute_interval_ms = 10
doppler_tolerance_hz = 150.0
minimum_elevation_deg = 0.0

# Synthetic link-budget parameters (CV-1 / T-RSSI); optional — omitted keys use defaults.
# tx_power_dbm = 30.0
# tx_gain_dbi = 2.0
# rx_gain_dbi = 5.0
# link_budget_tolerance_db = 3.0
# Pointing residual tolerance (CV-2 / T-POINT); optional — default 0.25°.
# pointing_tolerance_deg = 0.25

# Synthetic HIL TM v1 APID inclusive band (CV-3); optional — defaults 0x7B0 … 0x7BF.
# hil_tm_v1_apid_min = 1968
# hil_tm_v1_apid_max = 1983

# CV-4 toy subsystem maps (optional — defaults match `StationConfig::default` / NeXosim driver).
# hil_eps_voltage_full_sun_v = 28.0
# hil_eps_voltage_eclipse_v = 24.0
# hil_thermal_c_full_sun = 32.0
# hil_thermal_c_eclipse = 12.0
# hil_eps_relative_tolerance = 0.1
# hil_thermal_absolute_tolerance_k = 10.0
# CV-5 HIL v1 body-rate ceiling |ω| (deg/s); optional — default 5.0.
# hil_body_rate_max_abs_deg_s = 5.0

# Earth orientation (Methodology D-043); optional — defaults 0. Copy today's values from IERS
# Bulletin A (https://datacenter.iers.org/data/latestVersion/bulletinA.txt): UT1-UTC in SECONDS
# (always within ±0.9), polar motion x/y in ARCSECONDS (a few tenths).
# ut1_minus_utc_s = -0.2273
# polar_motion_x_arcsec = 0.1875
# polar_motion_y_arcsec = 0.4171

# Atmospheric refraction for the pointing check (CV-2, D-042); optional — on by default with a
# standard atmosphere. Antennas point at the apparent (refracted) position: ~0.5° high at the horizon.
# refraction = true
# refraction_pressure_hpa = 1010.0
# refraction_temperature_c = 10.0

# TLE-age-aware Doppler tolerance (T-DOPPLER, D-044); optional — off by default. When on, the band
# widens by the range-rate error an along-track TLE error of (at_epoch + growth × age) km implies.
# doppler_tle_age_margin = false
# tle_error_km_at_epoch = 1.0
# tle_error_growth_km_per_day = 2.0

# Public reference ISS (ZARYA) element set — synthetic/public data only (see README / Methodology).
tle_inline = """
ISS (ZARYA)
1 25544U 98067A   20194.88612269 -.00002218  00000-0 -31515-4 0  9992
2 25544  51.6461 221.2784 0001413  89.1723 280.4612 15.49507896236008
"""

# Alternative: load TLE from a UTF-8 text file (two- or three-line set).
# tle_file = "path/to/elements.tle"

# Alternative: an operator ephemeris as a CCSDS OEM (KVN), e.g. from orbit determination or GPS
# (D-045). Frames GCRF/ICRF, EME2000, TEME or ITRF*; time systems UTC, TAI, TT or GPS. Replaces the TLE.
# oem_file = "path/to/ephemeris.oem"
