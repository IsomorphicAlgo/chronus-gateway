[package]
name = "chronus-hil-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "NeXosim HIL driver: synthetic spacecraft telemetry as CCSDS TM over UDP (Milestone 7)"
# crates.io discoverability (max 5 keywords; categories from the official slug list).
keywords = ["hil", "simulation", "ccsds", "telemetry", "spacecraft"]
categories = ["aerospace::simulation", "simulation"]
# PLANS.md is local-only (gitignored) and already lives outside this crate dir; excluded here too
# as a defensive no-op, same as the demo/showcase guards (`Methodology.md` D-025).
exclude = ["demo", "showcase", "PLANS.md"]

[[bin]]
name = "chronus-hil-sim"
path = "src/main.rs"

[dependencies]
nexosim.workspace = true
serde.workspace = true
chrono.workspace = true
ephemerust.workspace = true
# Version alongside path so `cargo package`/`publish` resolve the registry dependency.
chronus-gateway = { path = "../gateway", version = "0.1.0" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[dev-dependencies]
tokio.workspace = true
