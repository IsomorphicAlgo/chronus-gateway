[package]
name = "chronus-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "UDP replay of synthetic CCSDS TM datagrams from hex or JSONL (Showcase S3)"
# crates.io discoverability (max 5 keywords; categories from the official slug list).
keywords = ["ccsds", "udp", "replay", "telemetry", "testing"]
categories = ["aerospace::space-protocols", "command-line-utilities", "development-tools::testing"]
# Defensive: keep any mistaken `demo/` or `showcase/` trees out of the published tarball (`Methodology.md` D-025).
# PLANS.md is local-only (gitignored) and already lives outside this crate dir; excluded here too as a defensive no-op.
exclude = ["demo", "showcase", "PLANS.md"]

[[bin]]
name = "chronus-replay"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "fs"] }
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
