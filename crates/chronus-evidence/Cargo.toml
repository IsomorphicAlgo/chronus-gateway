[package]
name = "chronus-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "1.0 evidence tools for ChronusGateway-RS: soak/load driver and real-RF Doppler residuals (lab tools; not published)"
publish = false

[[bin]]
name = "chronus-soak"
path = "src/bin/chronus-soak.rs"

[[bin]]
name = "chronus-doppler"
path = "src/bin/chronus-doppler.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
clap.workspace = true
anyhow.workspace = true
chrono.workspace = true
# The Doppler tool reuses the gateway's own propagator and validation arithmetic (no copies).
chronus-gateway = { path = "../gateway" }

