[package]
name = "chronus-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Fast Rust TMTC gateway: CCSDS ingest, physics co-validation (Ephemerust), Open MCT JSON fan-out"
# Packaged into the tarball root as README.md; crates.io renders it (relative links resolve
# against `repository`). See finalization plan D.3.
readme = "../../README.md"
# Showcase/demo assets must live at workspace root (`demo/`), not here — defensive if paths appear
# inside this crate directory (`Methodology.md` D-025).
exclude = ["demo", "showcase"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
spacepackets.workspace = true
ephemerust.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
futures-util.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1"

[[bench]]
name = "parse_validate"
harness = false
