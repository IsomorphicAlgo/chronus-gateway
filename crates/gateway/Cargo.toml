[package]
name = "chronus-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Fast Rust CCSDS telemetry gateway: space packets and TM transfer frames, physics co-validation (Ephemerust), Open MCT realtime + history"
# Packaged into the tarball root as README.md; crates.io renders it (relative links resolve
# against `repository`). See finalization plan D.3.
readme = "../../README.md"
# crates.io discoverability (max 5 keywords; categories from the official slug list).
keywords = ["ccsds", "telemetry", "sgp4", "aerospace", "gateway"]
categories = ["aerospace", "aerospace::space-protocols", "network-programming"]
# Showcase/demo assets must live at workspace root (`demo/`), not here — defensive if paths appear
# inside this crate directory (`Methodology.md` D-025). PLANS.md is local-only (gitignored) and
# already lives outside this crate dir; excluded here too as a defensive no-op.
exclude = ["demo", "showcase", "PLANS.md"]

[features]
# Production builds ship without the synthetic hardware-in-the-loop (HIL) demo models: the toy
# EPS / thermal / body-rate cross-checks (CV-4 / CV-5, physics_flags bits 4-6) and the nadir-array
# Sun-illumination model behind them. Lab and demo crates enable `hil`; its API is not covered by
# the 1.x stability promise. Methodology.md D-046.
default = []
hil = []

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
spacepackets.workspace = true
ephemerust.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
futures-util.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1"
# Tranche 3: validates real gateway output against the published JSON Schemas (no network).
jsonschema = { version = "0.60", default-features = false }

[[bench]]
name = "parse_validate"
harness = false
