# fly.toml app configuration file generated for chronus-sandbox on 2026-10-10T19:01:04-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chronus-sandbox'
primary_region = 'sjc'

[build]
  dockerfile = 'demo/Dockerfile.public'

[env]
  ALLOWED_ORIGINS = 'https://demo.shintratech.net,https://shintratech.net,https://www.shintratech.net,https://chronus-sandbox.fly.dev'
  MAX_PER_IP = '3'
  MAX_SESSIONS = '40'
  RUST_LOG = 'info'
  SESSION_SECS = '600'
  TICK_HZ = '10'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 40
    soft_limit = 30

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
