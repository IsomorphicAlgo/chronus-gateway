# CI: tests, clippy, supply-chain gates. Ephemerust comes from crates.io (see Methodology
# D-037); no sibling checkout is needed anymore.
# Cross-target smoke (x86_64-unknown-linux-gnu publish shape): rationale in the maintainer's local
# test plan (PLANS.md, not part of this repository) → Cross-target smoke; D-031.
#
# cargo test exits with code 101 when tests fail; compile/link errors use other codes.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          path: chronus-gateway

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: clippy

      # Workspace build: the lab crates enable the gateway's `hil` feature, so this runs everything.
      - name: Cargo test
        working-directory: chronus-gateway
        run: cargo test

      # The production configuration: the gateway on its own, without the `hil` demo models.
      - name: Cargo test (gateway without hil)
        working-directory: chronus-gateway
        run: cargo test -p chronus-gateway

      # Showcase S1: ensure Compose spec is valid (no full `docker build` here — too slow for PR CI).
      - name: Validate demo Docker Compose spec
        working-directory: chronus-gateway
        run: docker compose -f demo/docker-compose.yml config --quiet

      - name: Setup Node.js (demo dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build demo dashboard (Vite)
        working-directory: chronus-gateway/demo/dashboard
        run: npm install && npm run build

      - name: Compile benchmarks (Criterion)
        working-directory: chronus-gateway
        run: cargo bench --no-run

      - name: Clippy
        working-directory: chronus-gateway
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (gateway without hil)
        working-directory: chronus-gateway
        run: cargo clippy -p chronus-gateway --all-targets -- -D warnings

      # Pin a crates.io version that exists (--locked uses the published lockfile). 0.21.3 was never released.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: cargo audit
        working-directory: chronus-gateway
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.18.6

      - name: cargo deny
        working-directory: chronus-gateway
        run: cargo deny check

  # Public-API drift gate (Tranche 1.6). From 0.3.0 on, every PR is compared against the last
  # release: in 0.x a breaking change must come with a minor bump, from 1.0 with a major one.
  # Baseline = latest tag, or the 0.2.0 release commit until the first tag exists.
  semver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the baseline revision)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick baseline revision
        id: baseline
        run: echo "rev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo ce1a8cd)" >> "$GITHUB_OUTPUT"

      - name: cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: chronus-gateway
          baseline-rev: ${{ steps.baseline.outputs.rev }}
