[workspace]
# Edition 2024 default: MSRV-aware resolver — dependency selection respects `rust-version` below.
resolver = "3"
members = ["crates/gateway", "crates/chronus-hil-sim", "crates/chronus-replay", "crates/chronus-demo-server"]

# Shared metadata + dependency versions. Member crates opt in with `field.workspace = true`
# (see Methodology.md → "Workspace + centralized dependency versions").
[workspace.package]
# First real version line (finalization plan D.1): pre-1.0, minor = breaking during 0.x.
# Bumped per tranche as the finalization plan progresses (see CHANGELOG.md).
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["MichaelHansen"]
repository = "https://github.com/IsomorphicAlgo/chronus-gateway"

[workspace.dependencies]
# Async runtime + observability
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP / WebSocket (Milestone 5; OD-B)
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "limit"] }
futures-util = "0.3"
base64 = { version = "0.23", default-features = false, features = ["std"] }

# Error handling
anyhow = "1"
thiserror = "2"

# CLI (Showcase S3 replay tool)
clap = { version = "4", features = ["derive"] }

# Time + serialization
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# CCSDS / ECSS packet standards (Space Packet primary header parsing). See Methodology D-010.
spacepackets = "0.18"

# HIL / Milestone 7 — discrete-event spacecraft driver (asynchronics/NeXosim).
nexosim = "1"

# Astrodynamics backend — published crate (SGP4 look-angles + range-rate + conical
# umbra/penumbra eclipse model for the Physics-Telemetry Co-Validation engine).
# Ephemerust 1.1+: stable API, corrected range rate (Doppler input), validated against an
# independent IAU 2000 reference; 1.1 adds the Earth-orientation frame chain used by the OEM
# backend (D-043, D-045). `default-features = false` skips its CLI (clap/env_logger).
# See Methodology D-041 (amends D-004/D-012/D-037; D-037 superseded the D-005 sibling checkout).
ephemerust = { version = "1.1", default-features = false }
